name: Export Connector 0.7.31 Development Source

on:
  push:
    branches:
      - connector-0.7.31-recipe-name-only-revision
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current development branch
        uses: actions/checkout@v4
        with:
          path: current
      - name: Check out connector 0.7.23 source branch
        uses: actions/checkout@v4
        with:
          ref: feature/connector-0.7.23
          path: connector-0723
      - name: Check out pre-connector audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-2026-07-24
          path: audit-2026-07-24
      - name: Remove checkout metadata
        run: |
          rm -rf current/.git connector-0723/.git audit-2026-07-24/.git
      - name: Upload repository source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: connector-0.7.31-development-source
          path: |
            current
            connector-0723
            audit-2026-07-24
          if-no-files-found: error
          retention-days: 1
