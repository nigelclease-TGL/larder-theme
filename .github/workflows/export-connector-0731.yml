name: Apply Connector 0.7.31 Development Payload

on:
  push:
    branches:
      - connector-0.7.31-recipe-name-only-revision

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: connector-0.7.31-recipe-name-only-revision
          fetch-depth: 0
      - name: Apply reviewed source payload
        shell: bash
        run: |
          cat > /tmp/connector-0731.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/connector-0731.b64 > /tmp/connector-0731.tar.gz
          test "$(sha256sum /tmp/connector-0731.tar.gz | awk '{print $1}')" = "6515c3054731e0a3007476b77be6771f9ce9f03b6d5e9758e5b4065e6a215725"
          tar -xzf /tmp/connector-0731.tar.gz -C .
          rm -f .github/workflows/export-connector-0731.yml
      - name: Validate connector 0.7.31
        run: bash connector/build.sh
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement connector 0.7.31 recipe-name-only revision scope"
          git push origin HEAD:connector-0.7.31-recipe-name-only-revision
