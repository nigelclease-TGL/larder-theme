name: Theme Check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude-dir=build -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts or 'vendor' in path.parts or 'node_modules' in path.parts:
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'valid: {path}')
          PY

      - name: Check CSS structure and common typos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for path in Path('assets/css').rglob('*.css'):
              text = path.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {path}')
              if 'dis:flex' in text:
                  raise SystemExit(f'Invalid display declaration: {path}')
              print(f'checked: {path}')
          PY

      - name: Check required theme files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            style.css
            readme.txt
            index.php
            functions.php
            header.php
            footer.php
            front-page.php
            page-recipes.php
            page-recipe-collections.php
            page-kitchen-notes.php
            page-my-story.php
            page-contact-me.php
            single.php
            single-nkt_product.php
            archive-nkt_product.php
            taxonomy-nkt_product_category.php
            taxonomy-nkt_product_brand.php
            search.php
            404.php
            theme.json
            inc/product-platform.php
            inc/recipe-products.php
            inc/shop-title.php
            inc/setup-wizard.php
            inc/site-health.php
            inc/discovery.php
            inc/search.php
            inc/content-audit.php
            inc/content-audit-screen.php
            inc/content-audit-integrations.php
            template-parts/content-product-card.php
            assets/css/nkt-brand.css
            assets/css/recipe-experience.css
            assets/css/discovery-phase-4.css
            assets/css/site-phase-4.css
            assets/css/launch-phase-5.css
            assets/css/growth-phase-6.css
            assets/css/admin-content-audit.css
            assets/css/admin-product-platform.css
            assets/css/shop-my-kitchen.css
            assets/css/recommended-products.css
            assets/js/navigation.js
            assets/js/recipe-tools.js
            assets/js/growth-events.js
            assets/js/product-admin.js
            assets/js/recommended-products-block.js
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Verify product platform contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const NKT_PRODUCT_PLATFORM_VERSION = '2.1.0-alpha.1';" inc/product-platform.php
          grep -q "const NKT_PRODUCT_POST_TYPE        = 'nkt_product';" inc/product-platform.php
          grep -q "const NKT_PRODUCT_CATEGORY_TAX     = 'nkt_product_category';" inc/product-platform.php
          grep -q "const NKT_PRODUCT_BRAND_TAX        = 'nkt_product_brand';" inc/product-platform.php
          grep -q "'_nkt_product_retailers'" inc/product-platform.php
          grep -q "'_nkt_product_gallery_ids'" inc/product-platform.php
          grep -q "Amazon UK" inc/product-platform.php
          grep -q "nofollow sponsored noopener noreferrer" single-nkt_product.php
          grep -q "inc/product-platform.php" functions.php

      - name: Verify recipe product integration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const NKT_RECIPE_PRODUCT_META = '_nkt_recipe_product_ids';" inc/recipe-products.php
          grep -q "register_post_meta" inc/recipe-products.php
          grep -q "nkt/recommended-products" inc/recipe-products.php
          grep -q "nkt_recommended_products" inc/recipe-products.php
          grep -q "Recipes using this product" inc/recipe-products.php
          grep -q "nofollow sponsored noopener noreferrer" inc/recipe-products.php
          grep -q "inc/recipe-products.php" functions.php
          grep -q "registerBlockType( 'nkt/recommended-products'" assets/js/recommended-products-block.js
          grep -q "apiVersion: 2" assets/js/recommended-products-block.js
          grep -q "useBlockProps" assets/js/recommended-products-block.js
          grep -q ".nkt-recommended-products" assets/css/recommended-products.css

      - name: Verify release version alignment
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n1)
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1)
          test -n "$version" || { echo 'Theme version missing.'; exit 1; }
          test "$version" = "$stable" || { echo "Version mismatch: style.css=$version readme.txt=$stable"; exit 1; }
          test "$version" = '2.1.0-alpha.4' || { echo "Unexpected Theme 2.1 release version: $version"; exit 1; }

      - name: Confirm evergreen recipe dates remain hidden
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '<time' single.php
          ! grep -q 'get_the_date' front-page.php

      - name: Build installable theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nigels-kitchen-table
          rsync -a ./ build/nigels-kitchen-table/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='connector' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='*.zip' \
            --exclude='.DS_Store'
          cd build
          zip -qr nigels-kitchen-table.zip nigels-kitchen-table
          unzip -tq nigels-kitchen-table.zip

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nigels-kitchen-table-theme
          path: build/nigels-kitchen-table.zip
          if-no-files-found: error
          retention-days: 14
