name: Apply Connector 0.7.31 Payload

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'connector-0.7.31-recipe-name-only-revision'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: connector-0.7.31-recipe-name-only-revision
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract and verify committed payload
        shell: bash
        run: |
          cat .github/connector-0731-payload/part-*.txt > /tmp/connector-0731.b64
          base64 -d /tmp/connector-0731.b64 > /tmp/connector-0731.tar.gz
          test "$(sha256sum /tmp/connector-0731.tar.gz | awk '{print $1}')" = "6515c3054731e0a3007476b77be6771f9ce9f03b6d5e9758e5b4065e6a215725"
          tar -xzf /tmp/connector-0731.tar.gz -C .
          git restore --source=HEAD -- .github/workflows/connector-check.yml
          rm -rf .github/connector-0731-payload
          find connector -type d -name __pycache__ -prune -exec rm -rf {} +
          chmod 0644 connector/build.sh connector/build_0731.py connector/tests/test_connector_0731.py connector/tests/test_recipe_name_only_0731.py

      - name: Validate connector 0.7.31
        run: bash connector/build.sh

      - name: Commit implementation source
        shell: bash
        run: |
          find connector -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add connector
          git add -u .github/connector-0731-payload
          git commit -m "Implement connector 0.7.31 recipe-name-only revision scope"
          git push origin HEAD:connector-0.7.31-recipe-name-only-revision
