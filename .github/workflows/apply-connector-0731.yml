name: Apply Connector 0.7.31 Payload

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'connector-0.7.31-recipe-name-only-revision'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: connector-0.7.31-recipe-name-only-revision
          fetch-depth: 0

      - name: Extract and verify committed payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          text = Path('.github/workflows/export-connector-0731.yml').read_text(encoding='utf-8')
          candidates = re.findall(r'H4sI[A-Za-z0-9+/=]+', text)
          if not candidates:
              raise SystemExit('No gzip base64 payload found')
          payload = max(candidates, key=len)
          if payload.endswith('PAYLOAD'):
              payload = payload[:-7]
          payload += '=' * (-len(payload) % 4)
          archive = base64.b64decode(payload, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = '6515c3054731e0a3007476b77be6771f9ce9f03b6d5e9758e5b4065e6a215725'
          if digest != expected:
              raise SystemExit(f'Payload SHA mismatch: {digest}')
          Path('/tmp/connector-0731.tar.gz').write_bytes(archive)
          PY
          tar -xzf /tmp/connector-0731.tar.gz -C .
          rm -f .github/workflows/export-connector-0731.yml .github/workflows/apply-connector-0731.yml

      - name: Validate connector 0.7.31
        run: bash connector/build.sh

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement connector 0.7.31 recipe-name-only revision scope"
          git push origin HEAD:connector-0.7.31-recipe-name-only-revision
